<!doctype html><html lang="is"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vallarforgjöf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1712" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Vallarforgjöf</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: two views on one screen, no page scrolling.
   Table view: saved-tee picker and inputs on top, result table filling the rest (two columns, or one when limited to VF 10–30).
   Players view: a list of players with include-checkbox, name, handicap index and sex. */
:root {
  --bg: #eef3ef;
  --card: #ffffff;
  --ink: #12261c;
  --muted: #5a6e63;
  --line: #d3ded7;
  --green: #1d5a3c;
  --green-ink: #ffffff;
  --flag: #f2c230;
  --flag-ink: #1b1600;
  --row-alt: #f2f6f3;
  --err: #b3261e;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --rowh: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1712; --card: #15231b; --ink: #e4eee8; --muted: #93a89c; --line: #2a3d32;
    --green: #3d9a6a; --green-ink: #06120b; --flag: #f2c230; --flag-ink: #1b1600; --row-alt: #1a2b21; --err: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1712; --card: #15231b; --ink: #e4eee8; --muted: #93a89c; --line: #2a3d32;
  --green: #3d9a6a; --green-ink: #06120b; --flag: #f2c230; --flag-ink: #1b1600; --row-alt: #1a2b21; --err: #ff8a80;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.3;
  overflow: hidden;
}
.wrap {
  box-sizing: border-box;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding-block: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

header { display: flex; align-items: center; gap: 8px; flex: none; }
.flag { width: 20px; height: 24px; flex: none; }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.35rem;
  line-height: 1;
  margin: 0;
  flex: 1;
  min-width: 0;
}
.head-ctl { display: grid; gap: 2px; flex: none; justify-items: center; }

label, .lbl {
  font-family: var(--display);
  font-weight: 600;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  white-space: nowrap;
}

input, select {
  width: 100%;
  box-sizing: border-box;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 8px;
}
input {
  font: 600 1.3rem/1 var(--display);
  font-variant-numeric: tabular-nums;
  padding: 8px 4px;
  text-align: center;
}
input.name { text-align: left; padding-left: 10px; letter-spacing: 0.02em; }
input::placeholder { color: var(--muted); opacity: 0.6; }
select {
  font: 600 1.1rem/1.2 var(--display);
  padding: 7px 8px;
  min-width: 0;
}
input:focus, select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
input[aria-invalid="true"] { border-color: var(--err); }

button {
  font-family: var(--display);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  border-radius: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:active { transform: translateY(1px); filter: brightness(0.95); }
button:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; transform: none; }
.primary {
  font-size: 1.15rem;
  color: var(--green-ink);
  background: var(--green);
  border: 0;
  padding: 10px 22px;
}
.ghost {
  flex: none;
  font-size: 0.95rem;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  padding: 0 12px;
}
.ghost.icon { width: 40px; min-height: 36px; padding: 0; display: grid; place-items: center; }
.ghost.icon svg { width: 20px; height: 20px; }
.ghost.armed { color: #fff; background: var(--err); border-color: var(--err); font-size: 0.8rem; }

.tees { flex: none; display: flex; gap: 6px; }
.picker { flex: 1; min-width: 0; position: relative; }
.pick-btn {
  width: 100%;
  height: 100%;
  min-height: 36px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 10px;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  text-transform: none;
  letter-spacing: 0;
  text-align: left;
}
.pick-btn[aria-expanded="true"] { border-color: var(--green); }
.pick-btn svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.pick-label {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
  overflow: hidden;
  white-space: nowrap;
  font-size: 1.1rem;
}
.pick-label b, .pick-list b { font-weight: 700; }
.pick-sub { color: var(--muted); font-family: var(--body); font-weight: 500; font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; }
.pick-ph { color: var(--muted); font-weight: 600; }
.pick-list {
  position: absolute;
  z-index: 20;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  margin: 0;
  padding: 4px;
  list-style: none;
  max-height: 60vh;
  overflow-y: auto;
  background: var(--card);
  border: 1.5px solid var(--green);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}
.pick-list li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 10px;
  border-radius: 6px;
  font-family: var(--display);
  font-size: 1.15rem;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pick-list li + li { border-top: 1px solid var(--line); }
.pick-list li:hover { background: var(--row-alt); }
.pick-list li[aria-selected="true"] { background: var(--green); color: var(--green-ink); }
.pick-list li[aria-selected="true"] .pick-sub { color: inherit; }

form {
  flex: none;
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) repeat(3, minmax(0, 1fr)) auto;
  gap: 6px;
  align-items: end;
}
.field { display: grid; gap: 2px; min-width: 0; }
form .primary { height: calc(1.3rem + 19px); padding: 0 14px; }

.toggle {
  display: flex;
  align-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
header .toggle { justify-content: center; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch {
  position: relative;
  width: 38px; height: 22px;
  border-radius: 11px;
  background: var(--line);
  transition: background .15s;
  flex: none;
}
.switch::after {
  content: "";
  position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--card);
  box-shadow: 0 1px 2px rgba(0,0,0,.25);
  transition: transform .15s;
}
.toggle input:checked + .switch { background: var(--green); }
.toggle input:checked + .switch::after { transform: translateX(16px); }
.toggle input:focus-visible + .switch { outline: 3px solid var(--flag); outline-offset: 2px; }

.msg { margin: 0; font-size: 0.85rem; flex: none; color: var(--muted); }
.msg.error { color: var(--err); }

/* ---------- table ---------- */
.result {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.result.single { grid-template-columns: 1fr; }
.col {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  min-width: 0;
  align-self: start;
}
.row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  height: var(--rowh);
  padding: 0 8px;
  font-size: calc(var(--rowh) * 0.62);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.row:nth-child(odd):not(.head) { background: var(--row-alt); }
.row.head {
  background: var(--green);
  color: var(--green-ink);
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: max(10px, calc(var(--rowh) * 0.55));
}
/* Rows where one or more players land. */
.row.has, .row.has:nth-child(odd) {
  background: var(--flag);
  color: var(--flag-ink);
  font-weight: 600;
}
.row.has .dash, .row.has .plus, .row.has .who, .row.head .who { color: inherit; }
.range .dash { color: var(--muted); padding: 0 0.25em; }
.who {
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 8px;
  color: var(--green);
  font-weight: 600;
}
.ch {
  text-align: right;
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.2em;
  padding-left: 6px;
}
.plus { color: var(--green); }

.note { flex: none; color: var(--muted); font-size: 0.7rem; margin: 0; text-align: center; }

/* ---------- players ---------- */
.hint { flex: none; margin: 0; color: var(--muted); font-size: 0.85rem; }
.plist {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  align-content: start;
  gap: 6px;
}
.prow, .phead {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 4.4em 71px 40px;
  gap: 6px;
  align-items: center;
}
.phead { flex: none; padding-top: 2px; }
.phead span:first-child { text-align: center; }
.prow input[type="checkbox"] {
  width: 24px; height: 24px; margin: 0 auto;
  accent-color: var(--green);
}
.prow input { padding: 7px 4px; font-size: 1.2rem; }
.prow.off .pname, .prow.off .phi { opacity: 0.5; }
.sex { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.sex button {
  width: 34px; height: 34px;
  border: 0; border-radius: 0;
  font-size: 1rem;
  background: var(--card);
  color: var(--muted);
}
.sex button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
.empty { color: var(--muted); font-size: 0.9rem; padding: 8px 2px; margin: 0; }

@media (prefers-reduced-motion: no-preference) {
  .result.fresh .col { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: .3 } to { opacity: 1 } }
}
</style>

<div class="wrap">

  <!-- ===== Table view ===== -->
  <div class="view" id="mainView">
    <header>
      <svg class="flag" viewBox="0 0 34 40" aria-hidden="true">
        <rect x="6" y="3" width="2.5" height="34" rx="1" fill="var(--ink)"/>
        <path d="M8.5 4 L30 10 L8.5 17 Z" fill="var(--flag)"/>
        <ellipse cx="7.25" cy="37" rx="6" ry="2" fill="var(--green)"/>
      </svg>
      <h1>Vallarforgjöf</h1>
      <div class="head-ctl">
        <label for="part">Bara VF 10–30</label>
        <label class="toggle">
          <input type="checkbox" id="part">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
    </header>

    <div class="tees">
      <div class="picker" id="picker">
        <button type="button" class="pick-btn" id="pickBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Vistaðir teigar">
          <span class="pick-label" id="pickLabel"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="pick-list" id="pickList" role="listbox" hidden></ul>
      </div>
      <button type="button" class="ghost" id="new">Nýr</button>
      <button type="button" class="ghost icon" id="del" aria-label="Eyða teig"></button>
      <button type="button" class="ghost icon" id="openPlayers" aria-label="Leikmenn"></button>
    </div>

    <form id="form" novalidate>
      <div class="field">
        <label for="name">Teigur + M/K</label>
        <input id="name" class="name" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="GK 57 K">
      </div>
      <div class="field">
        <label for="cr">CR</label>
        <input id="cr" inputmode="decimal" autocomplete="off" placeholder="71,2">
      </div>
      <div class="field">
        <label for="sr">Slope</label>
        <input id="sr" inputmode="numeric" autocomplete="off" placeholder="128">
      </div>
      <div class="field">
        <label for="par">Par</label>
        <input id="par" inputmode="numeric" autocomplete="off" placeholder="72">
      </div>
      <button type="submit" class="primary" id="calc">Reikna</button>
    </form>
    <p class="msg" id="msg" hidden></p>

    <section class="result" id="result" hidden>
      <div class="col" id="col1"></div>
      <div class="col" id="col2"></div>
    </section>

    <p class="note">WHS: grunnforgjöf × slope/113 + (CR − par), námundað</p>
  </div>

  <!-- ===== Players view ===== -->
  <div class="view" id="playersView" hidden>
    <header>
      <button type="button" class="ghost icon" id="back" aria-label="Til baka í töflu"></button>
      <h1>Leikmenn</h1>
    </header>
    <p class="hint">Hakaðu við þá sem eiga að birtast í töflunni. Hver leikmaður birtist bara á teigum síns kyns (M = karl, K = kona).</p>
    <div class="phead">
      <span class="lbl">Með</span>
      <span class="lbl">Nafn / stafir</span>
      <span class="lbl">Forgjöf</span>
      <span class="lbl">Kyn</span>
      <span></span>
    </div>
    <div class="plist" id="plist"></div>
    <button type="button" class="primary" id="addPlayer">+ Bæta við leikmanni</button>
  </div>

</div>

<script>
(() => {
  const HI_MIN = -50;   // +5,0 in tenths
  const HI_MAX = 540;   // 54,0 in tenths
  const PART_MIN = 10, PART_MAX = 30; // course handicaps shown when "Bara VF 10–30" is on
  const STORE = "vallarforgjof:last";
  const TEES = "vallarforgjof:tees";
  const PLAYERS = "vallarforgjof:players";
  const $ = id => document.getElementById(id);
  let rowsPerCol = 0;
  let msgTimer = 0;

  const ICON = {
    trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>`,
    people: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.9.3 5 2.4 5 5.3"/></svg>`,
    back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`
  };
  $("del").innerHTML = ICON.trash;
  $("openPlayers").innerHTML = ICON.people;
  $("back").innerHTML = ICON.back;

  const load = (key, fallback) => {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; }
  };
  const save = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  };

  const parseNum = s => {
    const t = String(s).trim().replace(",", ".");
    return t === "" || isNaN(t) ? NaN : Number(t);
  };
  // "+2,3" is a plus handicap, stored as -23 tenths.
  const parseHI = s => {
    const t = String(s).trim();
    if (t === "") return null;
    const n = parseNum(t.replace(/^\+/, ""));
    if (isNaN(n)) return NaN;
    const tenths = Math.round(n * 10) * (t.startsWith("+") ? -1 : 1);
    return tenths >= HI_MIN && tenths <= HI_MAX ? tenths : NaN;
  };
  const validHI = v => typeof v === "number" && !Number.isNaN(v);
  const cleanName = s => String(s).trim().replace(/\s+/g, " ").toUpperCase();
  // Tee names end in M (men) or K (women), e.g. "GK 47 M".
  const teeSex = name => { const m = cleanName(name).match(/(?:^|\s)([MK])$/); return m ? m[1] : null; };
  const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // Course handicap for a handicap index given in tenths. Integer math so .5 always rounds up.
  function courseHandicap(hiTenths, crTenths, slope, par) {
    const num = hiTenths * slope + (crTenths - par * 10) * 113; // value = num / 1130
    return Math.floor((2 * num + 1130) / 2260);
  }

  function buildRanges(cr, slope, par) {
    const crTenths = Math.round(cr * 10);
    const rows = [];
    for (let h = HI_MIN; h <= HI_MAX; h++) {
      const ch = courseHandicap(h, crTenths, slope, par);
      const last = rows[rows.length - 1];
      if (last && last.ch === ch) last.to = h;
      else rows.push({ from: h, to: h, ch });
    }
    return rows;
  }

  const fmtHI = t => {
    const s = (Math.abs(t) / 10).toFixed(1).replace(".", ",");
    return t < 0 ? "+" + s : s;
  };
  const fmtCH = n => n < 0 ? "+" + Math.abs(n) : String(n);
  const fmtCR = n => n.toFixed(1).replace(".", ",");

  function showMsg(text, isError) {
    clearTimeout(msgTimer);
    $("msg").textContent = text;
    $("msg").classList.toggle("error", !!isError);
    $("msg").hidden = false;
    fit();
    if (!isError) msgTimer = setTimeout(() => { $("msg").hidden = true; fit(); }, 3500);
  }
  function showError(msg, el) {
    showMsg(msg, true);
    if (el) { el.setAttribute("aria-invalid", "true"); el.focus(); }
    return null;
  }

  // Two taps to delete: the first arms the button, the second confirms within 3 seconds.
  function armable(btn, onConfirm) {
    let timer = 0;
    const disarm = () => {
      clearTimeout(timer);
      if (btn.classList.contains("armed")) { btn.classList.remove("armed"); btn.innerHTML = ICON.trash; }
    };
    btn.addEventListener("click", () => {
      if (!btn.classList.contains("armed")) {
        btn.classList.add("armed");
        btn.textContent = "Viss?";
        timer = setTimeout(disarm, 3000);
        return;
      }
      disarm();
      onConfirm();
    });
    return disarm;
  }

  /* ---------- saved tees ---------- */

  let tees = load(TEES, []);
  if (!Array.isArray(tees)) tees = [];

  let current = ""; // name of the selected saved tee, "" when none

  const teeDetails = t => `${fmtCR(t.cr)} / ${t.sr} / ${t.par}`;

  function renderTees(selected) {
    tees.sort((a, b) => a.name.localeCompare(b.name, "is"));
    current = selected && tees.some(t => t.name === selected) ? selected : "";
    const t = tees.find(x => x.name === current);
    $("pickLabel").innerHTML = t
      ? `<b>${escapeHtml(t.name)}</b><span class="pick-sub">${teeDetails(t)}</span>`
      : `<span class="pick-ph">${tees.length ? "Veldu völl / teig…" : "Engir vistaðir teigar enn"}</span>`;
    $("pickBtn").disabled = !tees.length;
    $("pickList").innerHTML = tees.map(x =>
      `<li role="option" tabindex="-1" data-name="${escapeHtml(x.name)}" aria-selected="${x.name === current}">
         <b>${escapeHtml(x.name)}</b><span class="pick-sub">${teeDetails(x)}</span>
       </li>`).join("");
    disarmTee();
    $("del").disabled = !current;
  }

  // Inline drop-down: the list opens right under the button instead of the phone's own picker.
  function openPicker(open) {
    $("pickList").hidden = !open;
    $("pickBtn").setAttribute("aria-expanded", open);
    if (open) {
      const sel = $("pickList").querySelector('[aria-selected="true"]') || $("pickList").firstElementChild;
      sel && sel.scrollIntoView({ block: "nearest" });
    }
  }
  $("pickBtn").addEventListener("click", () => openPicker($("pickList").hidden));
  document.addEventListener("click", e => { if (!e.target.closest("#picker")) openPicker(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") openPicker(false); });
  $("pickList").addEventListener("click", e => {
    const li = e.target.closest("li");
    if (!li) return;
    openPicker(false);
    selectTee(li.dataset.name);
  });

  function upsertTee(name, cr, sr, par) {
    const existing = tees.find(t => t.name === name);
    if (existing) {
      const changed = existing.cr !== cr || existing.sr !== sr || existing.par !== par;
      Object.assign(existing, { cr, sr, par });
      return changed ? "Uppfært" : null;
    }
    tees.push({ name, cr, sr, par });
    return "Vistað";
  }

  function selectTee(name) {
    const t = tees.find(x => x.name === name);
    if (!t) return;
    renderTees(name);
    $("name").value = t.name;
    $("cr").value = fmtCR(t.cr);
    $("sr").value = t.sr;
    $("par").value = t.par;
    render();
    rememberLast();
  }

  // Empties the inputs (the placeholders show an example tee) and removes the table below.
  function clearForm() {
    openPicker(false);
    renderTees("");
    ["name", "cr", "sr", "par"].forEach(id => { $(id).value = ""; $(id).removeAttribute("aria-invalid"); });
    rowsPerCol = 0;
    $("col1").innerHTML = $("col2").innerHTML = "";
    $("result").hidden = true;
    rememberLast();
  }

  $("new").addEventListener("click", () => {
    clearForm();
    showMsg("Sláðu inn teig með M eða K aftast, CR, slope og par og ýttu á Reikna.");
    $("name").focus();
  });

  const disarmTee = armable($("del"), () => {
    const name = current;
    if (!name) return;
    tees = tees.filter(t => t.name !== name);
    save(TEES, tees);
    clearForm();
    showMsg(`${name} eytt.`);
  });

  /* ---------- players ---------- */

  let players = load(PLAYERS, []);
  if (!Array.isArray(players)) players = [];
  const savePlayers = () => save(PLAYERS, players);

  function playerRowHtml(p) {
    const hiBad = Number.isNaN(parseHI(p.hi));
    return `<div class="prow${p.on ? "" : " off"}" data-id="${p.id}">
        <input type="checkbox" class="pon" ${p.on ? "checked" : ""} aria-label="Taka ${escapeHtml(p.name || "leikmann")} með">
        <input class="pname name" value="${escapeHtml(p.name)}" placeholder="Nafn / stafir" autocomplete="off" spellcheck="false" aria-label="Nafn">
        <input class="phi" value="${escapeHtml(p.hi)}" inputmode="decimal" autocomplete="off" placeholder="18,4" aria-label="Grunnforgjöf"${hiBad ? ' aria-invalid="true"' : ""}>
        <div class="sex" role="group" aria-label="Kyn">
          <button type="button" data-sex="M" aria-pressed="${p.sex === "M"}" aria-label="Karl">M</button>
          <button type="button" data-sex="K" aria-pressed="${p.sex === "K"}" aria-label="Kona">K</button>
        </div>
        <button type="button" class="ghost icon pdel" aria-label="Eyða leikmanni">${ICON.trash}</button>
      </div>`;
  }

  function renderPlayers() {
    $("plist").innerHTML = players.length
      ? players.map(playerRowHtml).join("")
      : `<p class="empty">Engir leikmenn enn. Ýttu á „Bæta við leikmanni“.</p>`;
    $("plist").querySelectorAll(".pdel").forEach(btn => {
      const id = btn.closest(".prow").dataset.id;
      armable(btn, () => {
        players = players.filter(p => p.id !== id);
        savePlayers();
        renderPlayers();
      });
    });
  }

  const playerOf = el => players.find(p => p.id === el.closest(".prow").dataset.id);

  $("plist").addEventListener("input", e => {
    const p = playerOf(e.target);
    if (!p) return;
    if (e.target.classList.contains("pname")) p.name = e.target.value.trim();
    if (e.target.classList.contains("phi")) {
      p.hi = e.target.value.trim();
      e.target.toggleAttribute("aria-invalid", Number.isNaN(parseHI(p.hi)));
    }
    savePlayers();
  });
  $("plist").addEventListener("change", e => {
    if (!e.target.classList.contains("pon")) return;
    const p = playerOf(e.target);
    p.on = e.target.checked;
    e.target.closest(".prow").classList.toggle("off", !p.on);
    savePlayers();
  });
  $("plist").addEventListener("click", e => {
    const b = e.target.closest(".sex button");
    if (!b) return;
    const p = playerOf(b);
    p.sex = b.dataset.sex;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    savePlayers();
  });

  $("addPlayer").addEventListener("click", () => {
    players.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: "", hi: "", sex: "M", on: true });
    savePlayers();
    renderPlayers();
    const rows = $("plist").querySelectorAll(".prow");
    const last = rows[rows.length - 1];
    last.scrollIntoView({ block: "nearest" });
    last.querySelector(".pname").focus();
  });

  // Players for the current tee: included, same sex as the tee, with a valid handicap.
  function activePlayers(sex) {
    if (!sex) return [];
    return players
      .filter(p => p.on && p.name && p.sex === sex && validHI(parseHI(p.hi)))
      .map(p => ({ name: p.name, hi: parseHI(p.hi) }))
      .sort((a, b) => a.name.localeCompare(b.name, "is"));
  }

  /* ---------- views ---------- */

  function showPlayers(push) {
    $("mainView").hidden = true;
    $("playersView").hidden = false;
    renderPlayers();
    if (push) history.pushState({ view: "players" }, "");
  }
  function showMain() {
    $("playersView").hidden = true;
    $("mainView").hidden = false;
    render(true);
  }
  $("openPlayers").addEventListener("click", () => showPlayers(true));
  // Back arrow and the phone's own back button both return to the table.
  $("back").addEventListener("click", () => history.state && history.state.view === "players" ? history.back() : showMain());
  window.addEventListener("popstate", () => { if (!$("playersView").hidden) showMain(); });

  /* ---------- table ---------- */

  const head = names => `<div class="row head"><span>Grunnforgjöf</span><span class="who">${names ? "Leikmenn" : ""}</span><span>VF</span></div>`;
  const rowHtml = (r, group) => {
    const who = group.filter(p => p.hi >= r.from && p.hi <= r.to).map(p => escapeHtml(p.name)).join(", ");
    return `<div class="row${who ? " has" : ""}">
      <span class="range">${fmtHI(r.from)}<span class="dash">–</span>${fmtHI(r.to)}</span>
      <span class="who">${who}</span>
      <span class="ch${r.ch < 0 ? " plus" : ""}">${fmtCH(r.ch)}</span>
    </div>`;
  };

  // Size rows so the column(s) (header + rows) fill the space left on screen.
  function fit() {
    if (!rowsPerCol || $("result").hidden || $("mainView").hidden) return;
    const h = $("result").clientHeight - 2; // borders
    const rowh = Math.min(36, Math.max(11, Math.floor((h / (rowsPerCol + 1)) * 10) / 10));
    document.documentElement.style.setProperty("--rowh", rowh + "px");
  }

  function readInputs(quiet) {
    ["cr", "sr", "par"].forEach(id => $(id).removeAttribute("aria-invalid"));
    const cr = parseNum($("cr").value);
    const sr = parseNum($("sr").value);
    const par = parseNum($("par").value);
    if (!(cr >= 25 && cr <= 85)) return quiet ? null : showError("CR þarf að vera tala, t.d. 70,1.", $("cr"));
    if (!(Number.isInteger(sr) && sr >= 55 && sr <= 155)) return quiet ? null : showError("Slope þarf að vera heil tala á bilinu 55–155.", $("sr"));
    if (!(Number.isInteger(par) && par >= 27 && par <= 80)) return quiet ? null : showError("Par þarf að vera heil tala, t.d. 72.", $("par"));
    return { cr: Math.round(cr * 10) / 10, sr, par };
  }

  // Draws the table from the current inputs. Quiet = don't complain about empty fields.
  function render(quiet) {
    const v = readInputs(quiet);
    if (!v) return false;

    const single = $("part").checked;
    let rows = buildRanges(v.cr, v.sr, v.par);
    if (single) rows = rows.filter(r => r.ch >= PART_MIN && r.ch <= PART_MAX);
    const group = activePlayers(teeSex($("name").value));

    $("result").classList.toggle("single", single);
    $("col2").hidden = single;
    rowsPerCol = single ? rows.length : Math.ceil(rows.length / 2);
    $("col1").innerHTML = head(group.length) + rows.slice(0, rowsPerCol).map(r => rowHtml(r, group)).join("");
    $("col2").innerHTML = single ? "" : head(group.length) + rows.slice(rowsPerCol).map(r => rowHtml(r, group)).join("");

    const res = $("result");
    res.hidden = false;
    res.classList.remove("fresh"); void res.offsetWidth; res.classList.add("fresh");
    fit();
    return v;
  }

  function rememberLast() {
    save(STORE, { name: $("name").value, cr: $("cr").value, sr: $("sr").value, par: $("par").value, part: $("part").checked });
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    document.activeElement && document.activeElement.blur();
    $("msg").hidden = true;
    $("name").removeAttribute("aria-invalid");
    const name = cleanName($("name").value);
    $("name").value = name;
    const v = render(false);
    if (!v) return;

    if (name) {
      if (!teeSex(name)) {
        showError("Endaðu nafn teigs á M (karlar) eða K (konur), t.d. GK 47 M. Teigurinn var ekki vistaður.", $("name"));
      } else {
        const result = upsertTee(name, v.cr, v.sr, v.par);
        if (!save(TEES, tees)) showMsg("Ekki tókst að vista í þessum vafra.", true);
        else if (result) showMsg(`${result}: ${name}`);
        renderTees(name);
      }
    }
    rememberLast();
  });
  $("part").addEventListener("change", () => { render(true); rememberLast(); });
  window.addEventListener("resize", fit);
  if (document.fonts) document.fonts.ready.then(fit);

  // Start with the last values used, or an example tee so the table is filled in.
  const start = load(STORE, null) || { name: "", cr: "71,2", sr: "128", par: "72" };
  $("name").value = start.name || "";
  $("cr").value = start.cr; $("sr").value = start.sr; $("par").value = start.par;
  $("part").checked = !!start.part;
  renderTees(cleanName(start.name || ""));
  render(true);
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</html>
